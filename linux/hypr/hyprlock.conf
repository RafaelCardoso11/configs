# USER
label {
    monitor = DP-3
    text = $USER
    color = rgba(255, 255, 255, 0.95)
    font_size = 16
    font_family = $font SemiBold
    position = 0, 170
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor = DP-3
    size = 240, 40
    rounding = -1
    outline_thickness = 0
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.3 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    inner_color = rgba(255, 255, 255, 0.15)
    font_color = rgba(255, 255, 255, 0.95)
    check_color = $color12
    fail_color = rgba(255, 90, 90, 0.6)
    capslock_color = rgba(255, 200, 80, 0.6)
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##ffffffaa">Enter Password</span>
    fail_text = <span foreground="##ffffffdd">Incorrect password</span>
    hide_input = false
    position = 0, 110
    halign = center
    valign = bottom
}

# Footer: network and keyboard layout, small and dim
label {
    monitor = DP-3
    text = cmd[update:30000] echo "󰈀  $(nmcli -t -f NAME connection show --active | grep -v '^br-\|^docker\|^lo$' | head -1)    󰌌  $LAYOUT"
    color = rgba(255, 255, 255, 0.6)
    font_size = 12
    font_family = Inter Medium
    position = -30, 24
    halign = right
    valign = bottom
}
