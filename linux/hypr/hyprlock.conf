# Hyprlock config, macOS-style layout: date + clock on top, user + password at the bottom

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts
$font = Inter

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    # NOTE: use only 1 path
	#path = screenshot   # screenshot of your desktop
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current # current wallpaper

    color = rgb(0,0,0) # color will be rendered initially until path is available

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 6
    blur_passes = 3 # 0 disables blurring
    noise = 0.0117
    contrast = 1.0
    brightness = 0.7
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# Date
label {
    monitor = DP-3
    text = cmd[update:60000] echo "$(date +'%A, %B %-d')"
    color = rgba(255, 255, 255, 0.85)
    font_size = 22
    font_family = Inter Display SemiBold
    position = 0, -120
    halign = center
    valign = top
}

# Clock
label {
    monitor = DP-3
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.92)
    font_size = 170
    font_family = Inter Display Bold
    position = 0, -165
    halign = center
    valign = top
}

# Avatar placeholder: initial inside a translucent circle (the ~/.face image below covers it when enabled)
shape {
    monitor = DP-3
    size = 96, 96
    rounding = -1
    color = rgba(255, 255, 255, 0.18)
    border_size = 0
    position = 0, 215
    halign = center
    valign = bottom
}

label {
    monitor = DP-3
    text = cmd[update:0] echo "$USER" | cut -c1 | tr a-z A-Z
    color = rgba(255, 255, 255, 0.95)
    font_size = 40
    font_family = Inter Display SemiBold
    position = 0, 237
    halign = center
    valign = bottom
}

