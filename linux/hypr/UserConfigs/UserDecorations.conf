# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 1
  gaps_in = 2
  gaps_out = 0
  
  col.active_border = $color15
  col.inactive_border = $color10
}

decoration {
  rounding = 0
  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0
  dim_special = 0.2

  # shadow {
  #   enabled = false
  #   range = 3
  #   render_power = 1

  #   color =  $color12
  #   color_inactive = $color10
  # }


  blur {
    enabled = true	
    size = 10
    passes = 2
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}

# translucent blurred menu bar
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace vicinae
# blur only the visible (rounded) part, not the transparent corners
layerrule = ignore_alpha 0.3, match:namespace vicinae
# VS Code: translucent with blur behind, a bit more when unfocused
windowrule = opacity 0.9 0.85, match:class ^([Cc]ode|com\.microsoft\.VSCode)$
