<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- "Apps" dock tile: vector redraw of WhiteSur's view-app-grid (which ships as a 64px PNG and blurs in the dock) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset="1" stop-color="#dcdce2"/>
    </linearGradient>
    <linearGradient id="c00" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34c759" stop-opacity="0.82"/><stop offset="1" stop-color="#34c759"/></linearGradient>
    <linearGradient id="c01" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcc00" stop-opacity="0.82"/><stop offset="1" stop-color="#ffcc00"/></linearGradient>
    <linearGradient id="c02" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9500" stop-opacity="0.82"/><stop offset="1" stop-color="#ff9500"/></linearGradient>
    <linearGradient id="c10" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3b30" stop-opacity="0.82"/><stop offset="1" stop-color="#ff3b30"/></linearGradient>
    <linearGradient id="c11" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e8e93" stop-opacity="0.82"/><stop offset="1" stop-color="#8e8e93"/></linearGradient>
    <linearGradient id="c12" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2d55" stop-opacity="0.82"/><stop offset="1" stop-color="#ff2d55"/></linearGradient>
    <linearGradient id="c20" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#af52de" stop-opacity="0.82"/><stop offset="1" stop-color="#af52de"/></linearGradient>
    <linearGradient id="c21" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#007aff" stop-opacity="0.82"/><stop offset="1" stop-color="#007aff"/></linearGradient>
    <linearGradient id="c22" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#30b0a0" stop-opacity="0.82"/><stop offset="1" stop-color="#30b0a0"/></linearGradient>
    <filter id="shade" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tile)"/>
  <g filter="url(#shade)">
    <rect x="25" y="25" width="24" height="24" rx="6" fill="url(#c00)"/>
    <rect x="52" y="25" width="24" height="24" rx="6" fill="url(#c01)"/>
    <rect x="79" y="25" width="24" height="24" rx="6" fill="url(#c02)"/>
    <rect x="25" y="52" width="24" height="24" rx="6" fill="url(#c10)"/>
    <rect x="52" y="52" width="24" height="24" rx="6" fill="url(#c11)"/>
    <rect x="79" y="52" width="24" height="24" rx="6" fill="url(#c12)"/>
    <rect x="25" y="79" width="24" height="24" rx="6" fill="url(#c20)"/>
    <rect x="52" y="79" width="24" height="24" rx="6" fill="url(#c21)"/>
    <rect x="79" y="79" width="24" height="24" rx="6" fill="url(#c22)"/>
  </g>
</svg>
